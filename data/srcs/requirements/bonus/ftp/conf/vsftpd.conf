listen=YES
listen_ipv6=NO
background=NO
isolate_network=NO
seccomp_sandbox=NO

pam_service_name=vsftpd

anonymous_enable=NO
local_enable=YES
write_enable=YES

local_root=/var/www/wordpress
local_umask=022

chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

connect_from_port_20=YES
ftp_data_port=20

xferlog_enable=NO
dual_log_enable=NO
log_ftp_protocol=NO
syslog_enable=NO

idle_session_timeout=600
data_connection_timeout=120

ssl_enable=NO